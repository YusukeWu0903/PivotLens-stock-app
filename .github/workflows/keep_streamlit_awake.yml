name: Keep Streamlit App Awake

on:
  schedule:
    # Every six hours, away from the top of the hour to reduce schedule delays.
    - cron: '53 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: false

jobs:
  visit-app:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium

      - name: Visit Streamlit app and wake it if needed
        env:
          STREAMLIT_APP_URL: https://pivotlens-stock-app-jynp9vfi7zghuaums3kgrk.streamlit.app/
        run: |
          python - <<'PY'
          import os
          import re
          import time

          from playwright.sync_api import sync_playwright

          url = os.environ["STREAMLIT_APP_URL"]
          app_title = re.compile(
              r"台股均線轉折選股系統|Taiwan Stock MA Crossover Screener"
          )
          wake_text = re.compile(r"get this app back up", re.IGNORECASE)

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              try:
                  page = browser.new_page()
                  response = page.goto(url, wait_until="domcontentloaded", timeout=60000)
                  print(f"Visited {page.url}; HTTP {response.status if response else 'unknown'}")

                  heading = page.get_by_role("heading", name=app_title).first
                  wake_button = page.get_by_text(wake_text).first
                  woke_app = False
                  deadline = time.monotonic() + 180

                  while time.monotonic() < deadline:
                      if heading.is_visible():
                          print(f"Streamlit app is ready; wake button clicked: {woke_app}")
                          break
                      if not woke_app and wake_button.is_visible():
                          wake_button.click()
                          woke_app = True
                          print("Clicked the Streamlit wake button")
                      page.wait_for_timeout(3000)
                  else:
                      raise RuntimeError(
                          f"App heading did not appear within 3 minutes; page title: {page.title()}"
                      )
              finally:
                  browser.close()
          PY

